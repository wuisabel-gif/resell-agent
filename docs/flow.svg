      <text x="380" y="852" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#f4f1e8">Publish to eBay</text>
      <text x="380" y="874" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d8c9a0">post, on your command</text>
      
    </g>
