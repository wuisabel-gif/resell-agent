      <text x="380" y="574" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">trimmed median + per-platform comparison</text>
      <path d="M380 590 L380 624" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
