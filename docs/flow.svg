      <text x="380" y="152" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#241423">Cut out the item</text>
      <text x="380" y="174" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">remove background · auto-crop   (optional: --clean)</text>
      <path d="M380 190 L380 224" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
