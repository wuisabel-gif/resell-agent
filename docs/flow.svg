      <text x="380" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">house, material, condition, size · Claude vision</text>
      <path d="M380 290 L380 324" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
