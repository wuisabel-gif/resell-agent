      <text x="380" y="674" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">eBay + Poshmark copy</text>
      <path d="M380 690 L380 724" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
