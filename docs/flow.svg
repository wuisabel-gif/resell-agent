      <text x="380" y="452" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#241423">Resolve category + specifics</text>
      <text x="380" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">eBay Taxonomy API</text>
      <path d="M380 490 L380 524" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
    <g>
