<svg viewBox="0 0 760 914" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="resell-agent flow: photographs to a published eBay listing">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a7b3f"/>
    </marker>
  </defs>
  <rect width="760" height="914" fill="#faf8f2"/>
  
    <g>
      <rect x="70" y="24" width="620" height="66" rx="6" fill="#f4f1ea" stroke="#dcd6ca" stroke-width="1.5"/>
      <text x="380" y="52" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#241423">Photographs + notes</text>
      <text x="380" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f6a5f">one image or a batch</text>
      <path d="M380 90 L380 124" stroke="#9a7b3f" stroke-width="2" marker-end="url(#arw)"/>
    </g>
