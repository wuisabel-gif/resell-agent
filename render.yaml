services:
  - type: web
    name: resell-agent
    runtime: node
    plan: free
    buildCommand: npm ci --omit=optional && npm run build
    startCommand: node dist/site-api.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: SITE_ALLOWED_ORIGINS
        value: https://wuisabel-gif.github.io
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOU_API_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_ENV
        value: production
      - key: BING_VISUAL_SEARCH_KEY
        sync: false
      - key: BING_VISUAL_SEARCH_ENDPOINT
        value: https://api.bing.microsoft.com/v7.0/images/visualsearch
